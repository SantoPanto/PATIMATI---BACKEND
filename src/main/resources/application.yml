# Veritabanı ve Flyway Ayarları
spring:
  datasource:
    # DİKKAT: Kendi veritabanı adını (örn: patimati_db) yazmalısın
    url: ${DB_URL:jdbc:postgresql://localhost:5432/patimati_db}
    # DİKKAT: Kendi PostgreSQL kullanıcı adını yazmalısın (genelde postgres'tir)
    username: ${DB_USER:postgres}
    # DİKKAT: Kendi PostgreSQL şifreni yazmalısın
    password: ${DB_PASSWORD}
  jpa:
    # Bu satırı ekleyerek Hibernate'e dialect'i manuel veriyoruz
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # ÖNEMLİ: Update yerine validate yapıyoruz
      ddl-auto: update
  flyway:
    enabled: true
    # Mevcut veritabanı boş değilse hata vermek yerine baseline noktasından başlar
    baseline-on-migrate: true
    # Baseline sürüm numarasını V1 script'imizle eşleştiriyoruz
    baseline-version: 1
    baseline-description: "Init Schema"

  # OAuth2 Google Giriş Ayarları
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: SIZIN_GOOGLE_CLIENT_ID_BILGINIZ
            client-secret: SIZIN_GOOGLE_CLIENT_SECRET_BILGINIZ
            scope:
              - email
              - profile

  # RabbitMQ — AI servisiyle asenkron köprü
  # Lokal geliştirmede varsayılanlar yeterli; sunucuda ortam değişkeniyle verilir.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Bağlantı koptuğunda yeniden denenir; AI ya da broker yeniden başladığında
    # backend'in elle yeniden başlatılması gerekmesin.
    connection-timeout: 10s

# AI eşleştirme ayarları (entegrasyon sözleşmesi §5)
ai:
  matching:
    # Aday yarıçapı. Bildirim yarıçapından (5 km) BİLEREK farklı:
    # kaybolan hayvan yürür, günlerce uzaklaşabilir.
    radius-km: ${AI_MATCHING_RADIUS_KM:25}
    # Eski ilanlar gürültü yaratır.
    window-days: ${AI_MATCHING_WINDOW_DAYS:90}
    # Aday başına ~7 KB (768 float); 100 aday ≈ 700 KB mesaj.
    max-candidates: ${AI_MATCHING_MAX_CANDIDATES:100}
    # Konumsuz fallback'in aday sınırı — mesafeye göre sıralanamadığı için
    # BİLEREK max-candidates'ten küçük (Faz 2 revize blueprint §5/§21).
    no-location-candidate-limit: ${AI_MATCHING_NO_LOCATION_LIMIT:30}
    # Kaynak bazlı eşik geçersiz kılma — BİLEREK burada tanımlı DEĞİL.
    # AI_MATCHING_INSTAGRAM_THRESHOLD ortam değişkeni verilmezse
    # ExternalMatchingService'teki @Value("...:#{null}") null'a düşer ve
    # AI kendi ortam değişkenindeki (MATCH_THRESHOLD, varsayılan 0.80)
    # değeri kullanır. 0.80'i Instagram için doğrulanmış kesin bir değer
    # olarak burada HARD-CODE ETMİYORUZ (blueprint §22) — bu yüzden boş
    # string yerine anahtarın kendisi tanımsız bırakılıyor.
  service:
    # AiMatchClient'ın senkron çağırdığı AI HTTP ucu (RabbitMQ'nun aksine
    # bu TEK yeni Java<->Python HTTP bağımlılığıdır — Faz 2 revize
    # blueprint §1/§5).
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    match-timeout: ${AI_SERVICE_MATCH_TIMEOUT:5s}

# Instagram ingestion (Faz 2 revize blueprint) — özellik bayrağı.
# KAPALIYKEN mevcut PatiMati işlevselliği hiçbir şekilde etkilenmez.
instagram:
  ingestion:
    enabled: ${INSTAGRAM_INGESTION_ENABLED:false}

# Collector -> Backend medya transferinin paylaşılan sırrı (blueprint §48).
# Kullanıcı JWT/OAuth altyapısıyla KARIŞTIRILMAZ, en dar kapsamlıdır.
internal:
  ingestion:
    api-key: ${INTERNAL_INGESTION_API_KEY:}

# PotentialMatch bildirim teslimatı (blueprint §4/§13) — gönder-sonra-
# işaretle sırasının süpürücü parametreleri.
potential-match:
  max-send-attempts: ${POTENTIAL_MATCH_MAX_SEND_ATTEMPTS:5}
  retry-grace-period: ${POTENTIAL_MATCH_RETRY_GRACE_PERIOD:PT2M}
  retry-interval: ${POTENTIAL_MATCH_RETRY_INTERVAL:PT2M}

# external_source_posts süpürücüleri (blueprint §5/§11) — takılı kalmış
# gönderileri ve Aşama 2 (eşleştirme) yeniden denemelerini yönetir.
external:
  maintenance:
    stale-grace-period: ${EXTERNAL_STALE_GRACE_PERIOD:PT6H}
    stage2-retry-max-age: ${EXTERNAL_STAGE2_RETRY_MAX_AGE:P1D}
    sweep-interval: ${EXTERNAL_SWEEP_INTERVAL:PT15M}
    stage2-retry-interval: ${EXTERNAL_STAGE2_RETRY_INTERVAL:PT5M}

# JWT Ayarları
jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration: 86400000 # Örnek token süresi # 24 Saat (Milisaniye cinsinden)

# Uygulama ve Depolama Ayarları
app:
  frontend:
    url: http://localhost:4200 # Frontend'in ayağa kalktığı adres
  storage:
    s3:
      bucket: patimati-medya-kutusu
      region: eu-central-1
      maxFileCount: 3
      maxFileSize: 5MB
      presignedUrlDuration: 15m

  # WebSocket ve STOMP bağlantı ayarları
  websocket:
    # Virgülle ayrılmış origin listesi ortam değişkeniyle canlı ortamda değiştirilebilir.
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}