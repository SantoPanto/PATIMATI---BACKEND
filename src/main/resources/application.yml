spring:
  # --- RFC 7807 ProblemDetail Ayarı ---
  mvc:
    problemdetails:
      enabled: true

  # --- Jackson Ayarları ---
  jackson:
    deserialization:
      ACCEPT_EMPTY_STRING_AS_NULL_OBJECT: true

  # --- Dosya Yükleme Ayarları ---
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB

  datasource:
    # DİKKAT: Kendi veritabanı adını (örn: patimati_db) yazmalısın
    url: ${DB_URL:jdbc:postgresql://localhost:5432/patimati_db}
    # DİKKAT: Kendi PostgreSQL kullanıcı adını yazmalısın (genelde postgres'tir)
    username: ${DB_USER:postgres}
    # DİKKAT: Kendi PostgreSQL şifreni yazmalısın
    password: ${DB_PASSWORD}
  jpa:
    # Bu satırı ekleyerek Hibernate'e dialect'i manuel veriyoruz
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Flyway ile uyum için varsayılan olarak validate kullanılır
      ddl-auto: ${DDL_AUTO:validate}
  flyway:
    enabled: true
    # Mevcut veritabanı boş değilse hata vermek yerine baseline noktasından başlar
    baseline-on-migrate: true
    # Baseline sürüm numarasını V1 script'imizle eşleştiriyoruz
    baseline-version: 1
    baseline-description: "Init Schema"
    # main ile feature dalları paralel migration numaraları üretebiliyor
    out-of-order: true

  # OAuth2 Google Giriş Ayarları
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  # RabbitMQ — AI servisiyle asenkron köprü
  # Lokal geliştirmede varsayılanlar yeterli; sunucuda ortam değişkeniyle verilir.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 10s

# AI eşleştirme ayarları (entegrasyon sözleşmesi §5)
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    match-timeout: ${AI_SERVICE_MATCH_TIMEOUT:5s}
  matching:
    radius-km: ${AI_MATCHING_RADIUS_KM:25}
    window-days: ${AI_MATCHING_WINDOW_DAYS:90}
    max-candidates: ${AI_MATCHING_MAX_CANDIDATES:100}
    no-location-candidate-limit: ${AI_MATCHING_NO_LOCATION_LIMIT:30}
  rabbitmq:
    result-dlq-enabled: ${AI_RESULT_DLQ_ENABLED:false}

# Instagram ingestion (Faz 2 revize blueprint) — özellik bayrağı.
# İlanların PatiMati'nin Instagram hesabında paylaşılması (kuyruk + Graph API)
# ile AYNI üst anahtar altında, ayrı alt bölümler.
instagram:
  ingestion:
    enabled: ${INSTAGRAM_INGESTION_ENABLED:false}
  graph:
    # Instagram Graph API (Content Publishing) taban adresi -- sürüm numarasını
    # burada tutmak, Meta'nın sürüm sonlandırmalarında tek satır değişikliği
    # yeterli kılar. "Instagram API with Instagram business login" kullanılıyor
    # (Facebook Sayfası GEREKMİYOR) -- bu yüzden varsayılan graph.facebook.com
    # DEĞİL graph.instagram.com.
    api-base: ${INSTAGRAM_GRAPH_API_BASE:https://graph.instagram.com/v21.0}
    # PatiMati'nin KENDİ Instagram Business/Creator hesabına ait uzun ömürlü
    # erişim token'ı. Yalnızca kendi hesabımıza paylaşım yapıldığı için
    # (başka kullanıcıların hesabına bağlanma YOK) Meta Business Verification/
    # App Review gerekmez -- hesap Meta Developer App'e "Tester" rolüyle
    # eklenip Development Mode'da kullanılır.
    access-token: ${INSTAGRAM_ACCESS_TOKEN:}
    # Paylaşım yapılacak Instagram Business hesabının ID'si (ig-user-id).
    business-account-id: ${INSTAGRAM_BUSINESS_ACCOUNT_ID:}
  publish:
    # Varsayılan KAPALI: env ayarlanmadıkça özellik uçtan uca devre dışı --
    # queueForReview hiçbir satır eklemez, mevcut davranışa dokunulmaz.
    enabled: ${INSTAGRAM_PUBLISH_ENABLED:false}

# Collector -> Backend medya transferinin paylaşılan sırrı
internal:
  ingestion:
    api-key: ${INTERNAL_INGESTION_API_KEY:}

# PotentialMatch bildirim teslimatı
potential-match:
  max-send-attempts: ${POTENTIAL_MATCH_MAX_SEND_ATTEMPTS:5}
  retry-grace-period: ${POTENTIAL_MATCH_RETRY_GRACE_PERIOD:PT2M}
  retry-interval: ${POTENTIAL_MATCH_RETRY_INTERVAL:PT2M}

# external_source_posts süpürücüleri
external:
  maintenance:
    stale-grace-period: ${EXTERNAL_STALE_GRACE_PERIOD:PT6H}
    stage2-retry-max-age: ${EXTERNAL_STAGE2_RETRY_MAX_AGE:P1D}
    sweep-interval: ${EXTERNAL_SWEEP_INTERVAL:PT15M}
    stage2-retry-interval: ${EXTERNAL_STAGE2_RETRY_INTERVAL:PT5M}

# JWT Ayarları
jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration: 86400000

# --- E-posta (şifre sıfırlama) ---
spring.mail:
  port: ${SPRING_MAIL_PORT:587}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true

# Uygulama ve Depolama Ayarları
app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173} # Frontend'in ayağa kalktığı adres (Canlıda FRONTEND_URL=https://patimati.me verilir)
  mail:
    from: ${MAIL_FROM:${SPRING_MAIL_USERNAME:}}
  geocoding:
    url: ${GEOCODING_URL:https://nominatim.openstreetmap.org/reverse}
    enabled: ${GEOCODING_ENABLED:true}
    timeout-ms: ${GEOCODING_TIMEOUT_MS:2500}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,https://patimati.me,https://www.patimati.me}
  storage:
    s3:
      bucket: ${S3_BUCKET:patimati-medya-kutusu}
      region: ${S3_REGION:eu-central-1}
      endpoint: ${S3_ENDPOINT:}
      path-style-access: ${S3_PATH_STYLE:false}
      max-file-count: 3
      max-file-size: 5MB
      presigned-url-duration: 15m

  # WebSocket ve STOMP bağlantı ayarları
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,https://patimati.me,https://www.patimati.me}

# Sunucu Yapılandırması (Railway / Canlı ve Yerel Port Desteği)
server:
  port: ${PORT:8080}
  forward-headers-strategy: native

# OpenAPI / Swagger UI Yapılandırması
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha