#server root seviyesinde olmalı
server:
  # Üretimde bir ters proxy'nin (Nginx/Cloudflare/ALB/Railway vb.) arkasında
  # çalışıyoruz -- "native" gömülü Tomcat'in kendi forwarded-header desteğini
  # (RemoteIpValve muadili) açar, bu da request.getRemoteAddr()'ı gerçekten
  # YENİDEN YAZAR. BİLİNÇLİ OLARAK "framework" DEĞİL: o strateji Spring'in
  # ForwardedHeaderFilter'ını kullanır ve yalnızca URL/şema/host yeniden
  # kurulumunu (redirect'ler, getRequestURL) düzeltir -- getRemoteAddr()'a HİÇ
  # dokunmaz. LoginRateLimiter (IP bazlı brute-force koruması) tam olarak
  # getRemoteAddr()'a güvendiği için bu ayrım burada kritik: "framework"
  # seçilseydi rate limiter hâlâ istemcinin uydurduğu X-Forwarded-For'u
  # görmeye devam ederdi.
  # PATIMATI-AI-social'daki AYNI sorunun aynı çözümü (bkz. o reponun
  # Dockerfile'ındaki "$PORT'u onurlandırma" notu) -- Railway her servise
  # rastgele bir $PORT atar, sabit 8080'i dinleyen bir uygulamaya trafik hiç
  # ulaşmaz. ${PORT:8080}: PORT ortam değişkeni varsa onu kullan, yoksa
  # (yerel geliştirme) 8080'e düş -- kimsenin local kurulumu bozulmuyor.
  port: ${PORT:8080}
  forward-headers-strategy: native

spring:
  # --- RFC 7807 ProblemDetail Ayarı ---
  mvc:
    problemdetails:
      enabled: true

  # --- Jackson Ayarları ---
  jackson:
    deserialization:
      ACCEPT_EMPTY_STRING_AS_NULL_OBJECT: true

  # --- Dosya Yükleme Ayarları ---
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB




  datasource:
    # DİKKAT: Kendi veritabanı adını (örn: patimati_db) yazmalısın
    url: ${DB_URL:jdbc:postgresql://localhost:5432/patimati_db}
    # DİKKAT: Kendi PostgreSQL kullanıcı adını yazmalısın (genelde postgres'tir)
    username: ${DB_USER:postgres}
    # DİKKAT: Kendi PostgreSQL şifreni yazmalısın
    password: ${DB_PASSWORD}
  jpa:
    # Bu satırı ekleyerek Hibernate'e dialect'i manuel veriyoruz
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Flyway ile uyum için varsayılan olarak validate kullanılır
      ddl-auto: ${DDL_AUTO:validate}
  flyway:
    enabled: true
    # Mevcut veritabanı boş değilse hata vermek yerine baseline noktasından başlar
    baseline-on-migrate: true
    # Baseline sürüm numarasını V1 script'imizle eşleştiriyoruz
    baseline-version: 1
    baseline-description: "Init Schema"
    # main ile feature dalları paralel migration numaraları üretebiliyor
    # (örn. main V9/V10 eklerken feature dalı kendi V9-V12'sini zaten
    # uygulamış, sonradan V11-V14'e yeniden numaralandırıldı). Böyle bir
    # ortam merge edildiğinde DB'de zaten UYGULANMIŞ daha yüksek sürümden
    # SONRA daha düşük sürümlü yeni migration'lar gelir — outOfOrder
    # olmadan Flyway bunu validate hatası sayar.
    out-of-order: true

  # OAuth2 Google Giriş Ayarları
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  # RabbitMQ — AI servisiyle asenkron köprü
  # Lokal geliştirmede varsayılanlar yeterli; sunucuda ortam değişkeniyle verilir.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Bağlantı koptuğunda yeniden denenir; AI ya da broker yeniden başladığında
    # backend'in elle yeniden başlatılması gerekmesin.
    connection-timeout: 10s

# AI eşleştirme ayarları (entegrasyon sözleşmesi §5)
ai:
  service:
    # AI servisinin taban adresi. Kodda da bir varsayılanı vardı ama burada
    # yazılı olmadığı için hangi değişkenle ezileceği hiçbir yerde görünmüyordu.
    # AiMatchService (native /analyze, /match) bu anahtarı okur.
    url: ${AI_SERVICE_URL:http://localhost:8000}
    # AiMatchClient (external/Instagram /match, bkz. ExternalMatchingService)
    # AYRI bir @Value ile aynı taban adresi okur -- iki istemci de aynı AI
    # servisine gider, yalnızca property adları farklı tarihlerde eklendi.
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    match-timeout: ${AI_SERVICE_MATCH_TIMEOUT:5s}
    # AI ile PAYLAŞILAN SIR (sözleşme §10 / A1). Verilirse backend, AI'ya giden
    # her istekte X-Api-Key başlığını gönderir -- hem AiMatchService HEM
    # AiMatchClient AYNI bu değeri okur (tek anahtar, iki istemci).
    #
    # ⚠ İki taraf birlikte yapılandırılmalı: yalnız AI'da anahtar varsa
    # çağrılar 401 alır, yalnız burada varsa AI başlığı yok sayar. Değer AI
    # deposundaki AI_API_KEY ile AYNI olmalı.
    #
    # Boş bırakılırsa başlık hiç eklenmez — bugünkü kurulum aynen çalışır.
    api-key: ${AI_API_KEY:}
  matching:
    # Aday yarıçapı. Bildirim yarıçapından (5 km) BİLEREK farklı:
    # kaybolan hayvan yürür, günlerce uzaklaşabilir.
    radius-km: ${AI_MATCHING_RADIUS_KM:25}
    # Eski ilanlar gürültü yaratır.
    window-days: ${AI_MATCHING_WINDOW_DAYS:90}
    # Aday başına ~7 KB (768 float); 100 aday ≈ 700 KB mesaj.
    max-candidates: ${AI_MATCHING_MAX_CANDIDATES:100}
    # Konumsuz fallback'in aday sınırı — mesafeye göre sıralanamadığı için
    # BİLEREK max-candidates'ten küçük (Faz 2 revize blueprint §5/§21).
    no-location-candidate-limit: ${AI_MATCHING_NO_LOCATION_LIMIT:30}
    # Kaynak bazlı eşik geçersiz kılma — BİLEREK burada tanımlı DEĞİL.
    # AI_MATCHING_INSTAGRAM_THRESHOLD ortam değişkeni verilmezse
    # ExternalMatchingService'teki @Value("...:#{null}") null'a düşer ve
    # AI kendi ortam değişkenindeki (MATCH_THRESHOLD, varsayılan 0.80)
    # değeri kullanır. 0.80'i Instagram için doğrulanmış kesin bir değer
    # olarak burada HARD-CODE ETMİYORUZ (blueprint §22) — bu yüzden boş
    # string yerine anahtarın kendisi tanımsız bırakılıyor.
  rabbitmq:
    # ai.analysis.result kuyruğuna x-dead-letter-exchange argümanı eklemek
    # KAPALI varsayılan: bu kuyruk broker'da bu argüman OLMADAN zaten canlı
    # olabilir ve RabbitMQ var olan bir kuyruğun argümanlarını yerinde
    # DEĞİŞTİRMEZ. Tek taraflı açmak (ya da yalnızca bu tarafta açmak)
    # PRECONDITION_FAILED'a yol açar. Açılış sırası: Python tarafındaki
    # eşdeğeri (SONUC_KUYRUGU_DLQ_ENABLED, app/topoloji.py) İLE BİRLİKTE
    # true yapılmalı VE kuyruk canlıda bir kez silinip yeniden kurulmalı
    # (bkz. docs/entegrasyon-sozlesmesi.md §2, PATIMATI-AI deposu).
    result-dlq-enabled: ${AI_RESULT_DLQ_ENABLED:false}

# Instagram ingestion (Faz 2 revize blueprint) — özellik bayrağı.
# KAPALIYKEN mevcut PatiMati işlevselliği hiçbir şekilde etkilenmez.
instagram:
  ingestion:
    enabled: ${INSTAGRAM_INGESTION_ENABLED:false}

# Collector -> Backend medya transferinin paylaşılan sırrı (blueprint §48).
# Kullanıcı JWT/OAuth altyapısıyla KARIŞTIRILMAZ, en dar kapsamlıdır.
internal:
  ingestion:
    api-key: ${INTERNAL_INGESTION_API_KEY:}

# PotentialMatch bildirim teslimatı (blueprint §4/§13) — gönder-sonra-
# işaretle sırasının süpürücü parametreleri.
potential-match:
  max-send-attempts: ${POTENTIAL_MATCH_MAX_SEND_ATTEMPTS:5}
  retry-grace-period: ${POTENTIAL_MATCH_RETRY_GRACE_PERIOD:PT2M}
  retry-interval: ${POTENTIAL_MATCH_RETRY_INTERVAL:PT2M}

# external_source_posts süpürücüleri (blueprint §5/§11) — takılı kalmış
# gönderileri ve Aşama 2 (eşleştirme) yeniden denemelerini yönetir.
external:
  maintenance:
    stale-grace-period: ${EXTERNAL_STALE_GRACE_PERIOD:PT6H}
    stage2-retry-max-age: ${EXTERNAL_STAGE2_RETRY_MAX_AGE:P1D}
    sweep-interval: ${EXTERNAL_SWEEP_INTERVAL:PT15M}
    stage2-retry-interval: ${EXTERNAL_STAGE2_RETRY_INTERVAL:PT5M}

# JWT Ayarları
jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration: 86400000 # Örnek token süresi # 24 Saat (Milisaniye cinsinden)

# Uygulama ve Depolama Ayarları
app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000} # Frontend'in ayağa kalktığı adres (vite.config.ts'te port sabit 3000)
  geocoding:
    # Ters geokodlama: koordinat → il/ilçe (V19). Kayıt anında ve
    # admin backfill ucunda kullanılır. Kapalıyken ya da servis hata
    # verdiğinde ilan akışı ETKİLENMEZ — alanlar boş kalır.
    # Nominatim politikası: tanıtıcı User-Agent zorunlu, hız ≤1 istek/sn
    # (backfill istekler arasında bekler).
    url: ${GEOCODING_URL:https://nominatim.openstreetmap.org/reverse}
    enabled: ${GEOCODING_ENABLED:true}
    timeout-ms: ${GEOCODING_TIMEOUT_MS:2500}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,https://patimati.me}
  storage:
    # VARSAYILAN = GERÇEK AWS S3. Yerelde MinIO için tek şalter:
    #   SPRING_PROFILES_ACTIVE=local        (bkz. application-local.yml)
    # Değişken verilmezse üretim tarafına düşer; yanlışlıkla sunucuda
    # localhost'a bakma ihtimali böylece yapısal olarak kapanıyor.
    s3:
      bucket: ${S3_BUCKET:patimati-medya-kutusu}
      region: ${S3_REGION:eu-central-1}
      # Boş ⇒ endpointOverride hiç çağrılmaz, gerçek AWS uçları kullanılır.
      endpoint: ${S3_ENDPOINT:}
      # AWS'de doğrusu virtual-host adresleme; path-style yalnız MinIO içindir.
      path-style-access: ${S3_PATH_STYLE:false}
      # access-key / secret-key BİLEREK yok: boş kalınca S3Config
      # DefaultCredentialsProvider'a düşer (IAM rolü, AWS_ACCESS_KEY_ID vb.).
      max-file-count: 3
      max-file-size: 5MB
      presigned-url-duration: 15m

  # WebSocket ve STOMP bağlantı ayarları
  websocket:
    # Virgülle ayrılmış origin listesi ortam değişkeniyle canlı ortamda değiştirilebilir.
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

# OpenAPI / Swagger UI Yapılandırması
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
