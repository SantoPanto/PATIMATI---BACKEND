# Veritabanı ve Flyway Ayarları
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/senin_db_adin
    username: user
    password: password
  jpa:
    hibernate:
      # ÖNEMLİ: Update yerine validate yapıyoruz
      ddl-auto: validate
    properties:
      hibernate:
      # Dialect satırını tamamen sildik
  flyway:
    enabled: true
    baseline-on-migrate: true # Mevcut tablolar varsa hata vermesin diye

  # OAuth2 Google Giriş Ayarları
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: SIZIN_GOOGLE_CLIENT_ID_BILGINIZ
            client-secret: SIZIN_GOOGLE_CLIENT_SECRET_BILGINIZ
            scope:
              - email
              - profile

# JWT Ayarları
jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: 86400000 # Örnek token süresi # 24 Saat (Milisaniye cinsinden)

# Frontend Yönlendirme URL'i
app:
  frontend:
    url: http://localhost:4200 # Frontend'in ayağa kalktığı adres