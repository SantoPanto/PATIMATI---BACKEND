# Veritabanı ve Flyway Ayarları
spring:
  server:
    forward-headers-strategy: native
  # --- Dosya Yükleme Ayarları ---
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB


  datasource:
    # DİKKAT: Kendi veritabanı adını (örn: patimati_db) yazmalısın
    url: ${DB_URL:jdbc:postgresql://localhost:5432/patimati_db}
    # DİKKAT: Kendi PostgreSQL kullanıcı adını yazmalısın (genelde postgres'tir)
    username: ${DB_USER:postgres}
    # DİKKAT: Kendi PostgreSQL şifreni yazmalısın
    password: ${DB_PASSWORD}
  jpa:
    # Bu satırı ekleyerek Hibernate'e dialect'i manuel veriyoruz
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # ÖNEMLİ: Update yerine validate yapıyoruz
      ddl-auto: update
  flyway:
    enabled: true
    # Mevcut veritabanı boş değilse hata vermek yerine baseline noktasından başlar
    baseline-on-migrate: true
    # Baseline sürüm numarasını V1 script'imizle eşleştiriyoruz
    baseline-version: 1
    baseline-description: "Init Schema"

  # OAuth2 Google Giriş Ayarları
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  # RabbitMQ — AI servisiyle asenkron köprü
  # Lokal geliştirmede varsayılanlar yeterli; sunucuda ortam değişkeniyle verilir.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Bağlantı koptuğunda yeniden denenir; AI ya da broker yeniden başladığında
    # backend'in elle yeniden başlatılması gerekmesin.
    connection-timeout: 10s

# AI eşleştirme ayarları (entegrasyon sözleşmesi §5)
ai:
  service:
    # AI servisinin taban adresi. Kodda da bir varsayılanı vardı ama burada
    # yazılı olmadığı için hangi değişkenle ezileceği hiçbir yerde görünmüyordu.
    url: ${AI_SERVICE_URL:http://localhost:8000}
    # AI ile PAYLAŞILAN SIR (sözleşme §10 / A1). Verilirse backend, AI'ya giden
    # her istekte X-Api-Key başlığını gönderir.
    #
    # ⚠ İki taraf birlikte yapılandırılmalı: yalnız AI'da anahtar varsa
    # çağrılar 401 alır, yalnız burada varsa AI başlığı yok sayar. Değer AI
    # deposundaki AI_API_KEY ile AYNI olmalı.
    #
    # Boş bırakılırsa başlık hiç eklenmez — bugünkü kurulum aynen çalışır.
    api-key: ${AI_API_KEY:}
  matching:
    # Aday yarıçapı. Bildirim yarıçapından (5 km) BİLEREK farklı:
    # kaybolan hayvan yürür, günlerce uzaklaşabilir.
    radius-km: ${AI_MATCHING_RADIUS_KM:25}
    # Eski ilanlar gürültü yaratır.
    window-days: ${AI_MATCHING_WINDOW_DAYS:90}
    # Aday başına ~7 KB (768 float); 100 aday ≈ 700 KB mesaj.
    max-candidates: ${AI_MATCHING_MAX_CANDIDATES:100}

# JWT Ayarları
jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration: 86400000 # Örnek token süresi # 24 Saat (Milisaniye cinsinden)

# Uygulama ve Depolama Ayarları
app:
  frontend:
    url: http://localhost:5173 # Frontend'in ayağa kalktığı adres
  storage:
    # VARSAYILAN = GERÇEK AWS S3. Yerelde MinIO için tek şalter:
    #   SPRING_PROFILES_ACTIVE=local        (bkz. application-local.yml)
    # Değişken verilmezse üretim tarafına düşer; yanlışlıkla sunucuda
    # localhost'a bakma ihtimali böylece yapısal olarak kapanıyor.
    s3:
      bucket: ${S3_BUCKET:patimati-medya-kutusu}
      region: ${S3_REGION:eu-central-1}
      # Boş ⇒ endpointOverride hiç çağrılmaz, gerçek AWS uçları kullanılır.
      endpoint: ${S3_ENDPOINT:}
      # AWS'de doğrusu virtual-host adresleme; path-style yalnız MinIO içindir.
      path-style-access: ${S3_PATH_STYLE:false}
      # access-key / secret-key BİLEREK yok: boş kalınca S3Config
      # DefaultCredentialsProvider'a düşer (IAM rolü, AWS_ACCESS_KEY_ID vb.).
      max-file-count: 3
      max-file-size: 5MB
      presigned-url-duration: 15m

  # WebSocket ve STOMP bağlantı ayarları
  websocket:
    # Virgülle ayrılmış origin listesi ortam değişkeniyle canlı ortamda değiştirilebilir.
    springdoc:
      api-docs:
        path: /v3/api-docs
      swagger-ui:
        path: /swagger-ui.html
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
